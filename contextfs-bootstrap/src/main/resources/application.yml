server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: contextfs
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/contextfs}
    username: ${POSTGRES_USERNAME:contextfs}
    password: ${POSTGRES_PASSWORD:contextfs}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true

contextfs:
  cache:
    # 读路径缓存 TTL（ISO-8601 时长）
    read-ttl: ${CACHE_READ_TTL:PT10M}
  levels:
    # write 后是否异步生成 L0/L1 摘要与向量
    async: ${LEVELS_ASYNC:true}
  llm:
    # L0/L1 摘要生成（OpenAI 兼容接口）
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    timeout: ${LLM_TIMEOUT:PT60S}
  embedding:
    # 三层内容向量化（OpenAI 兼容接口），维度需与 contextfs.storage.milvus.dimension 一致
    enabled: ${EMBEDDING_ENABLED:false}
    base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
  storage:
    milvus:
      # Milvus 适配构造即建立 gRPC 连接，仅在同时启用向量检索时开启
      enabled: ${MILVUS_ENABLED:false}
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      dimension: ${MILVUS_DIMENSION:1024}
  retrieval:
    # 目录递归检索：首轮 L0 向量 topK、内容加载最高层级、命中分数阈值、token 预算与下钻深度
    top-k-dir: ${RETRIEVAL_TOP_K_DIR:5}
    max-level: ${RETRIEVAL_MAX_LEVEL:L1}
    score-threshold: ${RETRIEVAL_SCORE_THRESHOLD:0.3}
    token-budget: ${RETRIEVAL_TOKEN_BUDGET:4096}
    max-depth: ${RETRIEVAL_MAX_DEPTH:3}
  memory:
    # Session 记忆管线：enabled=false 时仅归档不提取；async=true 时提取在线程池中执行
    enabled: ${CONTEXTFS_MEMORY_ENABLED:true}
    async: ${MEMORY_ASYNC:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
