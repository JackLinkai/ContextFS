server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: contextfs
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/contextfs}
    username: ${POSTGRES_USERNAME:contextfs}
    password: ${POSTGRES_PASSWORD:contextfs}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true

contextfs:
  cache:
    # 读路径缓存 TTL（ISO-8601 时长）
    read-ttl: ${CACHE_READ_TTL:PT10M}
  storage:
    milvus:
      # Milvus 适配构造即建立 gRPC 连接，阶段 4 接入向量化时再显式开启
      enabled: ${MILVUS_ENABLED:false}
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      dimension: ${MILVUS_DIMENSION:1024}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
